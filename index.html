<script id="hub-core">
const HubCore = (() => {
  const statuses = {todo:'To Do',progress:'In Progress',done:'Done'};
  const escape = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const statusOf = (task, overrides) => Object.hasOwn(statuses,overrides[task.id]) ? overrides[task.id] : task.status;
  const complete = (project, overrides) => project.tasks.length > 0 && project.tasks.every(task => statusOf(task,overrides)==='done');
  const split = (projects,overrides) => ({active:projects.filter(p=>!complete(p,overrides)),done:projects.filter(p=>complete(p,overrides))});
  const sanitize = (document, raw) => Object.fromEntries(document.projects.flatMap(p=>p.tasks).filter(t=>raw && Object.hasOwn(statuses,raw[t.id])).map(t=>[t.id,raw[t.id]]));
  const snapshot = (document, overrides) => ({...document,projects:document.projects.map(p=>({...p,tasks:p.tasks.map(t=>({...t,status:statusOf(t,overrides)}))}))});
  return {statuses,escape,statusOf,complete,split,sanitize,snapshot};
})();
</script>
<script id="hub-app">
(() => {

  function write(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch{storageOK=false;return false}}
  function setState(text,state=''){ $('save-state').textContent=text;$('save-state').dataset.state=state; }
  function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,6000)}
  function saved(){setState(cloud?'Synchronisiert':storageOK?'Lokal gespeichert':'Nur in dieser Sitzung',storageOK?'saved':'error')}
  function showHub(){ $('hub').hidden=false;$('navigation').hidden=false;$('login-form').hidden=true;$('export-button').hidden=false;$('logout-button').hidden=!cloud; }
  function showLogin(message=''){authEpoch++;doc=null;overrides={};session=null;pending.clear();try{localStorage.removeItem(sessionKey)}catch{};$('hub').hidden=true;$('navigation').hidden=true;$('export-button').hidden=true;$('logout-button').hidden=true;$('active-projects').replaceChildren();$('finished-projects').replaceChildren();$('goals').replaceChildren();$('values').replaceChildren();$('exercises').replaceChildren();$('document-date').textContent='';$('login-form').hidden=false;$('login-error').hidden=!message;$('login-error').textContent=message;setState('');}
  function renderBoard(project){
    const done=project.tasks.filter(t=>HubCore.statusOf(t,overrides)==='done').length;
    return `<details class="project" id="project-${E(project.id)}" data-project="${E(project.id)}" ${openStates[project.id]?'open':''}><summary><span>${E(project.name)}</span>${arrow}</summary><div class="board">${Object.entries(statuses).map(([status,label])=>{
      const tasks=project.tasks.filter(t=>HubCore.statusOf(t,overrides)===status);
      return `<div class="column" data-dropstatus="${status}" data-project-id="${E(project.id)}"><div class="column-head"><span class="dot" aria-hidden="true"></span>${label}<span class="column-count">${tasks.length}</span></div>${tasks.map(t=>`<article class="task" draggable="${!pending.has(t.id)}" data-task="${E(t.id)}" aria-busy="${pending.has(t.id)}"><span class="task-title">${E(t.title)}</span></article>`).join('')}</div>`;
    }).join('')}</div>${project.tasks.length?`<p class="project-progress">${done} von ${project.tasks.length} erledigt</p>`:''}</details>`;
  }
  function renderProjects(){
    if(dragging){renderAfterDrag=true;return}
    const groups=HubCore.split(doc.projects,overrides);
    $('active-projects').innerHTML=groups.active.map(renderBoard).join('');$('finished-projects').innerHTML=groups.done.map(renderBoard).join('');$('finished-group').hidden=!groups.done.length;

  }

    $('values').innerHTML='<span class="values-label">Werte</span>'+doc.values.map(v=>`<span class="value">${E(v)}</span>`).join('');
    $('goals').innerHTML=doc.horizons.map(h=>`<div class="goal-group"><div class="goal-head"><h3>${E(h.name)}</h3><span>${E(h.label)}</span></div><div class="goal-list">${h.goals.map(g=>`<div class="goal"><span>${E(g.title)}</span></div>`).join('')}</div></div>`).join('');
    $('exercises').innerHTML=doc.exercises.map(x=>`<details class="exercise"><summary><span>${E(x.name)}</span>${arrow}</summary><div class="exercise-content"><ol class="questions">${x.questions.map(q=>`<li>${E(q)}</li>`).join('')}</ol><a class="source" href="${E(x.url)}" target="_blank" rel="noopener noreferrer">${E(x.source)} ↗</a></div></details>`).join('');
    renderProjects();showHub();openHash();

  function adoptSession(value){session={access_token:value.access_token,refresh_token:value.refresh_token,expires_at:value.expires_at||Math.floor(Date.now()/1000)+value.expires_in};write(sessionKey,session)}
  async function tokenRequest(type,body){
    const response=await fetch(config.url+'/auth/v1/token?grant_type='+type,{method:'POST',headers:{'Content-Type':'application/json',apikey:config.key},body:JSON.stringify(body)});
    if(!response.ok){const error=new Error('Anmeldung fehlgeschlagen');error.status=response.status;throw error}return response.json();
  }
  async function ensureSession(){
    if(!session)throw new Error('Bitte erneut anmelden.');
    if(session.expires_at*1000>Date.now()+60000)return;
    if(refreshPromise)return refreshPromise;
    const refresh=async()=>{
      session=read(sessionKey,session);
      if(session.expires_at*1000>Date.now()+60000)return;
      const epoch=authEpoch;
      try{const next=await tokenRequest('refresh_token',{refresh_token:session.refresh_token});if(epoch!==authEpoch)throw new Error('Abgemeldet.');adoptSession(next)}

    };
    refreshPromise=(navigator.locks?navigator.locks.request(namespace+':refresh',refresh):refresh()).finally(()=>refreshPromise=null);
    return refreshPromise;
  }
  async function api(path,options={}){
    await ensureSession();
    const response=await fetch(config.url+'/rest/v1/'+path,{...options,headers:{apikey:config.key,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',Prefer:'return=representation',...options.headers},cache:'no-store'});
    if(response.status===401){showLogin('Bitte erneut anmelden.');throw new Error('Bitte erneut anmelden.')}

    return response.json();

  async function fetchCloud(){
    const [documents,rows]=await Promise.all([api('hub_content?select=document'),api('hub_tasks?select=id,status')]);
    if(!documents[0]?.document)throw new Error('Noch keine Inhalte verfügbar.');
    return {document:documents[0].document,status:HubCore.sanitize(documents[0].document,Object.fromEntries(rows.map(r=>[r.id,r.status])))};
  }

    try{
      const next=await fetchCloud();
      if(pending.size||epoch!==authEpoch||!session)return;
      const contentChanged=JSON.stringify(next.document)!==JSON.stringify(doc),changed=JSON.stringify(next.status)!==JSON.stringify(overrides);
      doc=next.document;overrides=next.status;
      if(contentChanged)renderContent();else if(changed)renderProjects();
      saved();
    }catch{if(session&&epoch===authEpoch)setState(navigator.onLine?'Abgleich nicht möglich':'Offline','error')}
    finally{pollBusy=false}
  }
  async function moveTask(id,status){
    if(!doc||!Object.hasOwn(statuses,status)||pending.has(id))return;
    const task=doc.projects.flatMap(p=>p.tasks).find(t=>t.id===id);if(!task)return;
    const before=HubCore.statusOf(task,overrides);if(before===status)return;
    overrides[id]=status;
    if(!cloud){write(statusKey,overrides);saved();renderProjects();if(!storageOK)toast('Browser-Speicherung nicht verfügbar. Bitte HTML sichern.');return}
    const epoch=authEpoch;pending.add(id);setState('Wird gespeichert …');renderProjects();
    try{
      const rows=await api('hub_tasks?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status})});
      if(epoch!==authEpoch)return;
      if(rows.length!==1)throw new Error('Aufgabe nicht gespeichert.');
      overrides[id]=rows[0].status;saved();
    }catch{if(epoch===authEpoch){overrides[id]=before;setState('Nicht gespeichert','error');toast('Änderung nicht gespeichert. Bitte erneut versuchen.')}}
    finally{if(epoch===authEpoch){pending.delete(id);if(pending.size)setState('Wird gespeichert …');if(doc)renderProjects()}}
  }
  function openHash(){
    const id=decodeURIComponent(location.hash.slice(1));if(!id.startsWith('project-'))return;
    const project=$(id);if(project){project.open=true;requestAnimationFrame(()=>project.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'}))}
  }
  document.addEventListener('dragstart',event=>{
    const task=event.target.closest('.task');if(!task||pending.has(task.dataset.task))return;
    dragging=true;event.dataTransfer.setData('text/plain',task.dataset.task);event.dataTransfer.effectAllowed='move';task.classList.add('dragging');
  });
  document.addEventListener('dragover',event=>{const column=event.target.closest('.column');if(column&&dragging){event.preventDefault();event.dataTransfer.dropEffect='move';column.classList.add('drag-target')}});
  document.addEventListener('dragleave',event=>{const column=event.target.closest('.column');if(column&&!column.contains(event.relatedTarget))column.classList.remove('drag-target')});
  document.addEventListener('drop',event=>{const column=event.target.closest('.column');if(!column||!dragging)return;event.preventDefault();const id=event.dataTransfer.getData('text/plain');const project=doc.projects.find(p=>p.id===column.dataset.projectId);if(project?.tasks.some(t=>t.id===id))moveTask(id,column.dataset.dropstatus)});
  document.addEventListener('dragend',()=>{dragging=false;document.querySelectorAll('.dragging,.drag-target').forEach(el=>el.classList.remove('dragging','drag-target'));if(renderAfterDrag&&doc){renderAfterDrag=false;renderProjects()}});
  window.addEventListener('hashchange',openHash);
  document.querySelectorAll('.nav a').forEach(link=>link.addEventListener('click',()=>{document.querySelectorAll('.nav a').forEach(a=>a.removeAttribute('aria-current'));link.setAttribute('aria-current','location')}));
  if('IntersectionObserver' in window){const observer=new IntersectionObserver(entries=>{const entry=entries.find(e=>e.isIntersecting);if(entry){document.querySelectorAll('.nav a').forEach(a=>{if(a.hash==='#'+entry.target.id)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current')})}},{rootMargin:'-90px 0px -60% 0px'});document.querySelectorAll('#hub>section').forEach(s=>observer.observe(s))}
  $('export-button').addEventListener('click',()=>{
    if(!doc||pending.size){toast('Bitte warten, bis alle Änderungen gespeichert sind.');return}
    const snapshot=JSON.stringify(HubCore.snapshot(doc,overrides),null,2).replace(/</g,'\\u003c');
    const localConfig=JSON.stringify({localId:crypto.randomUUID?crypto.randomUUID():String(Date.now())});
    const result=originalHTML.replace(/(<script id="hub-data" type="application\/json">)[\s\S]*?(<\/script>)/,(_,start,end)=>start+'\n'+snapshot+'\n'+end).replace(/(<script id="cloud-config" type="application\/json">)[\s\S]*?(<\/script>)/,(_,start,end)=>start+localConfig+end);
    const url=URL.createObjectURL(new Blob([result],{type:'text/html;charset=utf-8'}));const anchor=document.createElement('a');anchor.href=url;anchor.download='Projekte-und-Ziele.html';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),10000);
  });
  $('login-form').addEventListener('submit',async event=>{
    event.preventDefault();const button=event.target.querySelector('button');button.disabled=true;$('login-error').hidden=true;const epoch=authEpoch;
    try{const credentials=await tokenRequest('password',{email:$('email').value.trim(),password:$('password').value});if(epoch!==authEpoch)return;adoptSession(credentials);$('password').value='';const next=await fetchCloud();if(epoch!==authEpoch)return;doc=next.document;overrides=next.status;renderContent();saved()}
    catch(error){$('login-form').hidden=false;$('login-error').textContent=error.status===400?'E-Mail oder Passwort prüfen.':'Verbindung oder Zugang prüfen und erneut versuchen.';$('login-error').hidden=false;setState('')}
    finally{button.disabled=false}
  });
  $('logout-button').addEventListener('click',async()=>{const token=session?.access_token;showLogin();if(token)try{await fetch(config.url+'/auth/v1/logout?scope=local',{method:'POST',headers:{apikey:config.key,Authorization:'Bearer '+token}})}catch{}});
  window.addEventListener('focus',sync);window.addEventListener('online',sync);document.addEventListener('visibilitychange',sync);window.addEventListener('offline',()=>{if(cloud)setState('Offline','error')});
  window.addEventListener('storage',event=>{
    if(event.key===sessionKey&&cloud){session=read(sessionKey,null);if(!session)showLogin();else sync()}
    if(event.key===statusKey&&!cloud&&doc){overrides=HubCore.sanitize(doc,read(statusKey,{}));renderProjects()}
  });
  async function start(){
    openStates=read(openKey,{});
    if(!cloud){
      doc=JSON.parse($('hub-data').textContent);
      if(!doc){setState('Noch nicht eingerichtet','error');return}
      overrides=HubCore.sanitize(doc,read(statusKey,{}));write(statusKey,overrides);renderContent();saved();return;
    }
    session=read(sessionKey,null);
    if(!session){showLogin();return}
    setState('Wird geladen …');const epoch=authEpoch;
    try{const next=await fetchCloud();if(epoch!==authEpoch)return;doc=next.document;overrides=next.status;renderContent();saved()}
    catch{showLogin('Verbindung prüfen und erneut anmelden.')}
  }
  setInterval(sync,15000);start();
})();
</script>
</body>
</html>
