  // ---------- Rendering ----------

  // Fallback for browsers without CSS field-sizing: grow textareas with their content.

  // ---------- Saving ----------
  function persist(delay=600){

  async function flush(){

    const body=JSON.parse(JSON.stringify(doc));

      if(epoch!==authEpoch)return;

  function adopt(next){doc=next.document;rev=next.rev;renderContent();saved();

  // ---------- Cloud ----------
  function adoptSession(value){session={access_token:value.access_token,refresh_token:value.refresh_token,expires_at:value.expires_at||Math.floor(Date.now()/1000)+value.expires_in};write(sessionKey,session)}
  async function tokenRequest(type,body){
    const response=await fetch(config.url+'/auth/v1/token?grant_type='+type,{method:'POST',headers:{'Content-Type':'application/json',apikey:config.key},body:JSON.stringify(body)});
    if(!response.ok){const error=new Error('Anmeldung fehlgeschlagen');error.status=response.status;throw error}return response.json();
  }
  async function ensureSession(){
    if(!session)throw new Error('Bitte erneut anmelden.');
    if(session.expires_at*1000>Date.now()+60000)return;
    if(refreshPromise)return refreshPromise;
    const refresh=async()=>{
      session=read(sessionKey,session);
      if(session.expires_at*1000>Date.now()+60000)return;
      const epoch=authEpoch;
      try{const next=await tokenRequest('refresh_token',{refresh_token:session.refresh_token});if(epoch!==authEpoch)throw new Error('Abgemeldet.');adoptSession(next)}
      catch(error){if(error.status===400||error.status===401){showLogin('Bitte erneut anmelden.')}throw error}
    };
    refreshPromise=(navigator.locks?navigator.locks.request(namespace+':refresh',refresh):refresh()).finally(()=>refreshPromise=null);
    return refreshPromise;
  }
  async function api(path,options={}){
    await ensureSession();
    const response=await fetch(config.url+'/rest/v1/'+path,{...options,headers:{apikey:config.key,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',Prefer:'return=representation',...options.headers},cache:'no-store'});
    if(response.status===401){showLogin('Bitte erneut anmelden.');throw new Error('Bitte erneut anmelden.')}
    if(!response.ok){const error=new Error('Speichern nicht möglich.');error.status=response.status;try{const b=await response.json();error.detail=[b.code,b.message].filter(Boolean).join(' ')}catch{}throw error}
    return response.json();
  }
  async function fetchCloud(){
    let rows;revProblem='';
    try{rows=await api('hub_content?select=document,rev')}
    catch(error){if(error.status!==400)throw error;revProblem=error.detail||'Spalte rev fehlt';rows=await api('hub_content?select=document')}
    const row=rows[0];if(!row?.document)throw new Error('Noch keine Inhalte verfügbar.');
    if(!revProblem&&!Number.isInteger(row.rev))revProblem='rev = '+JSON.stringify(row.rev);
    const rowRev=Number.isInteger(row.rev)?row.rev:null;
    let source=row.document,migrated=false;
    if(!(source.version>=2)){
      // v1 kept task status in hub_tasks; fold it into the document once.
      const tasks=await api('hub_tasks?select=id,status');
      source=HubCore.snapshot(source,HubCore.sanitize(source,Object.fromEntries(tasks.map(r=>[r.id,r.status]))));migrated=true;
    }
    return {document:HubCore.normalize(source),rev:rowRev,migrated};
  }
  async function sync(){
    if(!cloud||!session||!doc||pending.size||pollBusy||saving||dirty||dragging||document.hidden||typing())return;
    pollBusy=true;const epoch=authEpoch;
    try{
      const next=await fetchCloud();
      if(pending.size||saving||dirty||typing()||epoch!==authEpoch||!session)return;
      if(next.rev!==rev||JSON.stringify(next.document)!==JSON.stringify(doc)){doc=next.document;rev=next.rev;renderContent()}
      saved();
    }catch{if(session&&epoch===authEpoch)setState(navigator.onLine?'Abgleich nicht möglich':'Offline','error')}
    finally{pollBusy=false}
  }

  // ---------- Changes ----------
  async function moveTask(id,status){
    if(!doc||!Object.hasOwn(statuses,status)||pending.has(id))return;
    const found=findTask(id);if(!found)return;
    const before=found.task.status;if(before===status)return;
    found.task.status=status;
    if(!cloud||rev!==null){renderProjects();persist(150);return}
    // Legacy mode until the database update ran: status lives in hub_tasks.
    const epoch=authEpoch;pending.add(id);setState('Wird gespeichert …');renderProjects();
    try{
      const rows=await api('hub_tasks?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status})});
      if(epoch!==authEpoch)return;
      if(rows.length!==1)throw new Error('Aufgabe nicht gespeichert.');
      found.task.status=rows[0].status;saved();
    }catch{if(epoch===authEpoch){found.task.status=before;setState('Nicht gespeichert','error');toast('Änderung nicht gespeichert. Bitte erneut versuchen.')}}
    finally{if(epoch===authEpoch){pending.delete(id);if(pending.size)setState('Wird gespeichert …');if(doc)renderProjects()}}
  }
  function refreshCounts(project){
    const box=document.getElementById('project-'+project.id);if(!box)return;
    box.querySelectorAll('.column').forEach(c=>c.querySelector('.column-count').textContent=c.querySelectorAll('.task').length);
    const done=project.tasks.filter(t=>t.status==='done').length;let p=box.querySelector('.project-progress');
    if(!project.tasks.length){p?.remove();return}
    if(!p){p=document.createElement('p');p.className='project-progress';box.append(p)}
    p.textContent=done+' von '+project.tasks.length+' erledigt';
  }
  // Turns a text span into an inline field, like tapping a line in a notes app.
  // Typing saves; Enter adds the next entry; an emptied entry disappears on leaving.
  function editInline(span,{value,multiline,apply,remove,next,placeholder}){
    if(!canWrite())return;
    const field=document.createElement(multiline?'textarea':'input');
    field.className='inline-input';field.value=value;field.placeholder=placeholder||'';field.setAttribute('aria-label',placeholder||'Eintrag');
    if(multiline)field.rows=1;
    const card=span.closest('.task');if(card)card.draggable=false;
    span.replaceWith(field);field.focus({preventScroll:true});field.setSelectionRange(field.value.length,field.value.length);autosize(field.parentElement);
    let closed=false;
    const close=addNext=>{
      if(closed)return;closed=true;
      const text=field.value.trim();
      if(!text){remove();persist(150);field.closest('.task,.goal,.value')?.remove()}
      else{apply(text);persist(400);const s=span.cloneNode(false);s.textContent=text;field.replaceWith(s);if(card)card.draggable=true}
      if(addNext&&text)next?.();
    };
    field.addEventListener('input',()=>{if(field.value.trim()){apply(field.value);persist(900)}autosize(field.parentElement)});
    field.addEventListener('keydown',event=>{
      if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();close(true)}
      else if(event.key==='Escape'){event.preventDefault();field.blur()}
    });
    field.addEventListener('blur',()=>close(false));
  }
  function addTask(projectId,status,after){
    const p=findProject(projectId);if(!p)return;
    const t={id:HubCore.uid('t'),title:'',status};
    const i=after?p.tasks.indexOf(after)+1:p.tasks.length;p.tasks.splice(i,0,t);

  }
  function addGoal(hi,after){

  function addValue(){doc.values.push('');renderGoals();const span=document.querySelector(`[data-action="edit-value"][data-index="${doc.values.length-1}"]`);if(span)startEdit(span)}

    try{const credentials=await tokenRequest('password',{email:$('email').value.trim(),password:$('password').value});if(epoch!==authEpoch)return;adoptSession(credentials);$('password').value='';const next=await fetchCloud();if(epoch!==authEpoch)return;adopt(next)}
    catch(error){$('login-form').hidden=false;$('login-error').textContent=error.status===400?'E-Mail oder Passwort prüfen.':'Verbindung oder Zugang prüfen und erneut versuchen.';$('login-error').hidden=false;setState('')}
    finally{button.disabled=false}
  });
  $('logout-button').addEventListener('click',async()=>{if((dirty||saving)&&!confirm('Es gibt ungespeicherte Änderungen. Trotzdem abmelden?'))return;const token=session?.access_token;showLogin();if(token)try{await fetch(config.url+'/auth/v1/logout?scope=local',{method:'POST',headers:{apikey:config.key,Authorization:'Bearer '+token}})}catch{}});
  window.addEventListener('focus',sync);window.addEventListener('online',()=>{if(dirty)flush();sync()});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){if(dirty)flush()}else sync()});
  window.addEventListener('pagehide',()=>{if(dirty)flush()});
  window.addEventListener('beforeunload',event=>{if(dirty||saving){event.preventDefault();event.returnValue=''}});
  window.addEventListener('offline',()=>{if(cloud)setState('Offline','error')});
  window.addEventListener('storage',event=>{
    if(event.key===sessionKey&&cloud){session=read(sessionKey,null);if(!session)showLogin();else sync()}
    if(event.key===docKey&&!cloud&&doc&&!typing()){doc=HubCore.normalize(read(docKey,doc));renderContent()}
  });
  async function start(){
    openStates=read(openKey,{});
    if(!cloud){
      const embedded=JSON.parse($('hub-data').textContent);
      if(!embedded){setState('Noch nicht eingerichtet','error');return}
      const stored=read(docKey,null);
      doc=HubCore.normalize(stored||HubCore.snapshot(embedded,HubCore.sanitize(embedded,read(statusKey,{}))));
      if(!stored)write(docKey,doc);
      renderContent();saved();return;
    }
    session=read(sessionKey,null);
    if(!session){showLogin();return}
    setState('Wird geladen …');const epoch=authEpoch;
    try{const next=await fetchCloud();if(epoch!==authEpoch)return;adopt(next)}
    catch{showLogin('Verbindung prüfen und erneut anmelden.')}
  }
  setInterval(sync,15000);start();
})();
</script>
</body>
</html>
