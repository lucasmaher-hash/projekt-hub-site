      projects:list(d.projects).filter(p=>p&&p.id!=null).map(p=>({id:String(p.id),name:text(p.name),tasks:list(p.tasks).filter(t=>t&&t.id!=null).map(t=>({id:String(t.id),title:text(t.title),status:Object.hasOwn(statuses,t.status)?t.status:'todo'}))})),

    };

  function taskCard(t){

      :`<h3>${E(h.name)}</h3><span>${E(h.label)}</span>`}</div><div class="goal-list">${h.goals.map((g,gi)=>editing

      :`<div class="goal"><span>${E(g.title)}</span></div>`).join('')}${editing?`<button class="add" type="button" data-action="add-goal" data-h="${hi}">+ Ziel</button>`:''}</div></div>`).join('');

  function renderDate(){$('document-date').textContent='Stand: '+new Intl.DateTimeFormat('de-DE',{day:'numeric',month:'long',year:'numeric'}).format(new Date(doc.updated+'T12:00:00'))}
  function renderContent(){
    if(!Object.keys(openStates).length&&doc.projects[0])openStates[doc.projects[0].id]=true;
    renderDate();renderGoals();renderExercises();renderProjects();showHub();openHash();
  }
  // Fallback for browsers without CSS field-sizing: grow textareas with their content.
  function autosize(root=document){if(CSS.supports?.('field-sizing','content'))return;root.querySelectorAll('textarea.task-input,textarea.notes,.exercise-edit textarea').forEach(el=>{el.style.height='auto';el.style.height=el.scrollHeight+2+'px'})}
  function setEditing(on,render=true){
    editing=on&&canWrite();

    const b=$('edit-button');b.setAttribute('aria-pressed',String(editing));b.innerHTML=editing?check:pencil;b.title=editing?'Fertig':'Bearbeiten';b.setAttribute('aria-label',editing?'Bearbeiten beenden':'Bearbeiten');

  // ---------- Saving ----------
  function persist(delay=600){
    if(!doc)return;
    doc.updated=today();renderDate();
    if(!cloud){write(docKey,doc);saved();if(!storageOK)toast('Browser-Speicherung nicht verfügbar. Bitte HTML sichern.');return}
    if(rev===null)return;
    dirty=true;setState('Wird gespeichert …');clearTimeout(saveTimer);saveTimer=setTimeout(flush,delay);
  }
  async function flush(){
    clearTimeout(saveTimer);saveTimer=null;
    if(saving||!dirty||!cloud||rev===null||!session)return;
    saving=true;dirty=false;const epoch=authEpoch;let retry=0;
    const body=JSON.parse(JSON.stringify(doc));
    try{
      const rows=await api('hub_content?rev=eq.'+rev,{method:'PATCH',body:JSON.stringify({document:body,rev:rev+1})});
      if(epoch!==authEpoch)return;
      if(rows.length!==1){
        // Another device saved first: take its version instead of overwriting it.
        dirty=false;const next=await fetchCloud();if(epoch!==authEpoch)return;
        adopt(next);toast('Auf einem anderen Gerät geändert. Neuester Stand geladen, bitte letzte Änderung prüfen.');return;
      }
      rev=rows[0].rev;if(!dirty)saved();
    }catch{if(epoch===authEpoch&&session){dirty=true;retry=5000;setState('Nicht gespeichert, neuer Versuch …','error')}}
    finally{saving=false;if(dirty&&epoch===authEpoch&&!saveTimer)saveTimer=setTimeout(flush,retry||300)}
  }
  function adopt(next){doc=next.document;rev=next.rev;renderContent();saved();
    if(next.migrated&&rev!==null){dirty=true;flush()}
    if(rev===null&&!legacyHinted){legacyHinted=true;toast('Bearbeiten ist freigeschaltet, sobald das Datenbank-Update in Supabase ausgeführt ist.')}
  }

  // ---------- Cloud ----------
  function adoptSession(value){session={access_token:value.access_token,refresh_token:value.refresh_token,expires_at:value.expires_at||Math.floor(Date.now()/1000)+value.expires_in};write(sessionKey,session)}
  async function tokenRequest(type,body){
    const response=await fetch(config.url+'/auth/v1/token?grant_type='+type,{method:'POST',headers:{'Content-Type':'application/json',apikey:config.key},body:JSON.stringify(body)});
    if(!response.ok){const error=new Error('Anmeldung fehlgeschlagen');error.status=response.status;throw error}return response.json();
  }
  async function ensureSession(){
    if(!session)throw new Error('Bitte erneut anmelden.');
    if(session.expires_at*1000>Date.now()+60000)return;
    if(refreshPromise)return refreshPromise;
    const refresh=async()=>{
      session=read(sessionKey,session);
      if(session.expires_at*1000>Date.now()+60000)return;
      const epoch=authEpoch;
      try{const next=await tokenRequest('refresh_token',{refresh_token:session.refresh_token});if(epoch!==authEpoch)throw new Error('Abgemeldet.');adoptSession(next)}
      catch(error){if(error.status===400||error.status===401){showLogin('Bitte erneut anmelden.')}throw error}
    };
    refreshPromise=(navigator.locks?navigator.locks.request(namespace+':refresh',refresh):refresh()).finally(()=>refreshPromise=null);
    return refreshPromise;
  }
  async function api(path,options={}){
    await ensureSession();
    const response=await fetch(config.url+'/rest/v1/'+path,{...options,headers:{apikey:config.key,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',Prefer:'return=representation',...options.headers},cache:'no-store'});
    if(response.status===401){showLogin('Bitte erneut anmelden.');throw new Error('Bitte erneut anmelden.')}
    if(!response.ok)throw new Error('Speichern nicht möglich.');
    return response.json();
  }
  async function fetchCloud(){
    const rows=await api('hub_content?select=*');
    const row=rows[0];if(!row?.document)throw new Error('Noch keine Inhalte verfügbar.');
    const rowRev=Number.isInteger(row.rev)?row.rev:null;
    let source=row.document,migrated=false;
    if(!(source.version>=2)){
      // v1 kept task status in hub_tasks; fold it into the document once.
      const tasks=await api('hub_tasks?select=id,status');
      source=HubCore.snapshot(source,HubCore.sanitize(source,Object.fromEntries(tasks.map(r=>[r.id,r.status]))));migrated=true;
    }
    return {document:HubCore.normalize(source),rev:rowRev,migrated};
  }
  async function sync(){
    if(!cloud||!session||!doc||pending.size||pollBusy||saving||dirty||dragging||document.hidden||typing())return;
    pollBusy=true;const epoch=authEpoch;
    try{
      const next=await fetchCloud();
      if(pending.size||saving||dirty||typing()||epoch!==authEpoch||!session)return;
      if(next.rev!==rev||JSON.stringify(next.document)!==JSON.stringify(doc)){doc=next.document;rev=next.rev;renderContent()}
      saved();
    }catch{if(session&&epoch===authEpoch)setState(navigator.onLine?'Abgleich nicht möglich':'Offline','error')}
    finally{pollBusy=false}
  }

  // ---------- Changes ----------
  async function moveTask(id,status){
    if(!doc||!Object.hasOwn(statuses,status)||pending.has(id))return;
    const found=findTask(id);if(!found)return;
    const before=found.task.status;if(before===status)return;
    found.task.status=status;
    if(!cloud||rev!==null){renderProjects();persist(150);return}
    // Legacy mode until the database update ran: status lives in hub_tasks.
    const epoch=authEpoch;pending.add(id);setState('Wird gespeichert …');renderProjects();
    try{
      const rows=await api('hub_tasks?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status})});
      if(epoch!==authEpoch)return;
      if(rows.length!==1)throw new Error('Aufgabe nicht gespeichert.');
      found.task.status=rows[0].status;saved();
    }catch{if(epoch===authEpoch){found.task.status=before;setState('Nicht gespeichert','error');toast('Änderung nicht gespeichert. Bitte erneut versuchen.')}}
    finally{if(epoch===authEpoch){pending.delete(id);if(pending.size)setState('Wird gespeichert …');if(doc)renderProjects()}}
  }
  function focusLater(selector){const el=document.querySelector(selector);if(el){el.focus({preventScroll:true});if(el.tagName==='INPUT')el.select();el.scrollIntoView({block:'nearest'})}}
  function onAction(button){
    if(!doc||!canWrite())return;
    const a=button.dataset.action,d=button.dataset;
    if(a==='add-task'){const p=findProject(d.project);if(!p)return;const t={id:HubCore.uid('t'),title:'',status:d.status};p.tasks.push(t);openStates[p.id]=true;renderProjects();focusLater(`textarea[data-task="${t.id}"]`)}
    else if(a==='delete-task'){const f=findTask(d.task);if(!f)return;f.project.tasks=f.project.tasks.filter(t=>t.id!==d.task);renderProjects();persist(150)}
    else if(a==='add-project'){const p={id:HubCore.uid('p'),name:'Neues Projekt',tasks:[]};doc.projects.push(p);openStates[p.id]=true;write(openKey,openStates);renderProjects();persist(150);focusLater(`input[data-edit="project-name"][data-project="${p.id}"]`)}
    else if(a==='delete-project'){const p=findProject(d.project);if(!p)return;if(!confirm(`„${p.name||'Ohne Namen'}“ mit ${p.tasks.length} Aufgaben löschen?`))return;doc.projects=doc.projects.filter(x=>x.id!==p.id);doc.horizons.forEach(h=>h.goals.forEach(g=>g.projects=g.projects.filter(id=>id!==p.id)));renderProjects();persist(150)}
    else if(a==='add-value'){doc.values.push('');renderGoals();focusLater(`input[data-edit="value"][data-index="${doc.values.length-1}"]`)}
    else if(a==='delete-value'){doc.values.splice(Number(d.index),1);renderGoals();persist(150)}
    else if(a==='add-goal'){const h=doc.horizons[Number(d.h)];if(!h)return;h.goals.push({title:'',projects:[]});renderGoals();focusLater(`input[data-edit="goal"][data-h="${d.h}"][data-g="${h.goals.length-1}"]`)}
    else if(a==='delete-goal'){const h=doc.horizons[Number(d.h)];if(!h)return;h.goals.splice(Number(d.g),1);renderGoals();persist(150)}
    else if(a==='add-exercise'){const x={id:HubCore.uid('x'),name:'Neue Übung',questions:[],source:'',url:'',notes:''};doc.exercises.push(x);openStates['ex:'+x.id]=true;write(openKey,openStates);renderExercises();persist(150);focusLater(`input[data-edit="exercise-name"][data-ex="${x.id}"]`)}
    else if(a==='delete-exercise'){const x=findExercise(d.ex);if(!x)return;if(!confirm(`Übung „${x.name||'Ohne Namen'}“${x.notes?' samt deinen Antworten':''} löschen?`))return;doc.exercises=doc.exercises.filter(e=>e.id!==x.id);renderExercises();persist(150)}
  }
  // Text fields write straight into the document while typing; no re-render, so focus stays put.
  function onInput(el){
    if(!doc||!canWrite())return;
    const k=el.dataset.edit,d=el.dataset,v=el.value;
    if(k==='task-title'){const f=findTask(d.task);if(!f)return;f.task.title=v}
    else if(k==='project-name'){const p=findProject(d.project);if(!p)return;p.name=v;const s=document.querySelector(`#project-${CSS.escape(p.id)}>summary>span`);if(s)s.textContent=v||'Ohne Namen'}
    else if(k==='value'){doc.values[Number(d.index)]=v;el.size=Math.max(5,v.length)}
    else if(k==='horizon-name'){doc.horizons[Number(d.h)].name=v}
    else if(k==='horizon-label'){doc.horizons[Number(d.h)].label=v}
    else if(k==='goal'){const h=doc.horizons[Number(d.h)];if(h?.goals[Number(d.g)])h.goals[Number(d.g)].title=v}
    else if(k==='exercise-name'){const x=findExercise(d.ex);if(!x)return;x.name=v;const s=el.closest('.exercise')?.querySelector('summary>span');if(s)s.textContent=v||'Ohne Namen'}
    else if(k==='exercise-questions'){const x=findExercise(d.ex);if(x)x.questions=v.split('\n').map(q=>q.trim()).filter(Boolean)}
    else if(k==='exercise-source'){const x=findExercise(d.ex);if(x)x.source=v}
    else if(k==='exercise-url'){const x=findExercise(d.ex);if(x)x.url=v.trim()}
    else if(k==='notes'){const x=findExercise(d.ex);if(x)x.notes=v}
    else return;
    if(el.tagName==='TEXTAREA')autosize(el.parentElement);
    persist(k==='notes'?1200:700);
  }
  // On leaving a field that was left empty, drop the entry. Only the DOM node is removed
  // (no re-render), so a click on another button in the same gesture still lands.
  function dropIfEmpty(el){
    if(!doc||!canWrite()||!el.dataset?.edit||el.value.trim())return;
    const k=el.dataset.edit,d=el.dataset;
    if(k==='task-title'){
      const f=findTask(d.task);if(!f)return;
      f.project.tasks=f.project.tasks.filter(t=>t.id!==d.task);
      const column=el.closest('.column');el.closest('.task')?.remove();
      if(column)column.querySelector('.column-count').textContent=column.querySelectorAll('.task').length;
    }else if(k==='value'){
      doc.values.splice(Number(d.index),1);el.closest('.value')?.remove();
      document.querySelectorAll('#values [data-index]').forEach(n=>{const i=[...document.querySelectorAll('#values .value')].indexOf(n.closest('.value'));n.dataset.index=i});
    }else if(k==='goal'){
      const h=doc.horizons[Number(d.h)];if(!h)return;h.goals.splice(Number(d.g),1);
      const group=el.closest('.goal-list');el.closest('.goal')?.remove();
      group?.querySelectorAll('.goal').forEach((g,i)=>g.querySelectorAll('[data-g]').forEach(n=>n.dataset.g=i));
    }else return;
    persist(150);
  }
  function openHash(){
    const id=decodeURIComponent(location.hash.slice(1));if(!id.startsWith('project-'))return;
    const project=$(id);if(project){project.open=true;requestAnimationFrame(()=>project.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'}))}
  }

  // ---------- Events ----------
  document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(b){event.preventDefault();onAction(b)}});
  document.addEventListener('input',event=>{if(event.target.dataset?.edit&&event.target.dataset.edit!=='task-status')onInput(event.target)});
  document.addEventListener('change',event=>{const el=event.target;if(el.dataset?.edit==='task-status'&&canWrite())moveTask(el.dataset.task,el.value)});
  document.addEventListener('focusout',event=>dropIfEmpty(event.target));
  document.addEventListener('keydown',event=>{
    const el=event.target;
    if(event.key==='Enter'&&!event.shiftKey&&el.matches?.('.task-input,input.field,.value-input')){event.preventDefault();el.blur()}
    if(event.key==='Escape'&&editing&&!el.matches?.('textarea.notes'))el.blur?.();

  $('edit-button').addEventListener('click',()=>{if(document.activeElement)document.activeElement.blur();setEditing(!editing);if(!editing&&dirty)flush()});
  document.addEventListener('dragstart',event=>{
    const task=event.target.closest?.('.task');if(!task||editing||pending.has(task.dataset.task))return;
    dragging=true;event.dataTransfer.setData('text/plain',task.dataset.task);event.dataTransfer.effectAllowed='move';task.classList.add('dragging');
  });
  document.addEventListener('dragover',event=>{const column=event.target.closest?.('.column');if(column&&dragging){event.preventDefault();event.dataTransfer.dropEffect='move';column.classList.add('drag-target')}});
  document.addEventListener('dragleave',event=>{const column=event.target.closest?.('.column');if(column&&!column.contains(event.relatedTarget))column.classList.remove('drag-target')});
  document.addEventListener('drop',event=>{const column=event.target.closest?.('.column');if(!column||!dragging)return;event.preventDefault();const id=event.dataTransfer.getData('text/plain');const project=findProject(column.dataset.projectId);if(project?.tasks.some(t=>t.id===id))moveTask(id,column.dataset.dropstatus)});
  document.addEventListener('dragend',()=>{dragging=false;document.querySelectorAll('.dragging,.drag-target').forEach(el=>el.classList.remove('dragging','drag-target'));if(renderAfterDrag&&doc){renderAfterDrag=false;renderProjects()}});
  window.addEventListener('hashchange',openHash);
  document.querySelectorAll('.nav a').forEach(link=>link.addEventListener('click',()=>{document.querySelectorAll('.nav a').forEach(a=>a.removeAttribute('aria-current'));link.setAttribute('aria-current','location')}));
  if('IntersectionObserver' in window){const observer=new IntersectionObserver(entries=>{const entry=entries.find(e=>e.isIntersecting);if(entry){document.querySelectorAll('.nav a').forEach(a=>{if(a.hash==='#'+entry.target.id)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current')})}},{rootMargin:'-90px 0px -60% 0px'});document.querySelectorAll('#hub>section').forEach(s=>observer.observe(s))}
  $('export-button').addEventListener('click',()=>{
    if(!doc||pending.size||dirty||saving){toast('Bitte warten, bis alle Änderungen gespeichert sind.');return}
    const snapshot=JSON.stringify(doc,null,2).replace(/</g,'\\u003c');
    const localConfig=JSON.stringify({localId:crypto.randomUUID?crypto.randomUUID():String(Date.now())});
    const result=originalHTML.replace(/(<script id="hub-data" type="application\/json">)[\s\S]*?(<\/script>)/,(_,start,end)=>start+'\n'+snapshot+'\n'+end).replace(/(<script id="cloud-config" type="application\/json">)[\s\S]*?(<\/script>)/,(_,start,end)=>start+localConfig+end);
    const url=URL.createObjectURL(new Blob([result],{type:'text/html;charset=utf-8'}));const anchor=document.createElement('a');anchor.href=url;anchor.download='Projekte-und-Ziele.html';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),10000);
  });
  $('login-form').addEventListener('submit',async event=>{
    event.preventDefault();const button=event.target.querySelector('button');button.disabled=true;$('login-error').hidden=true;const epoch=authEpoch;
    try{const credentials=await tokenRequest('password',{email:$('email').value.trim(),password:$('password').value});if(epoch!==authEpoch)return;adoptSession(credentials);$('password').value='';const next=await fetchCloud();if(epoch!==authEpoch)return;adopt(next)}
    catch(error){$('login-form').hidden=false;$('login-error').textContent=error.status===400?'E-Mail oder Passwort prüfen.':'Verbindung oder Zugang prüfen und erneut versuchen.';$('login-error').hidden=false;setState('')}
    finally{button.disabled=false}
  });
  $('logout-button').addEventListener('click',async()=>{if((dirty||saving)&&!confirm('Es gibt ungespeicherte Änderungen. Trotzdem abmelden?'))return;const token=session?.access_token;showLogin();if(token)try{await fetch(config.url+'/auth/v1/logout?scope=local',{method:'POST',headers:{apikey:config.key,Authorization:'Bearer '+token}})}catch{}});
  window.addEventListener('focus',sync);window.addEventListener('online',()=>{if(dirty)flush();sync()});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){if(dirty)flush()}else sync()});
  window.addEventListener('pagehide',()=>{if(dirty)flush()});
  window.addEventListener('beforeunload',event=>{if(dirty||saving){event.preventDefault();event.returnValue=''}});
  window.addEventListener('offline',()=>{if(cloud)setState('Offline','error')});
  window.addEventListener('storage',event=>{
    if(event.key===sessionKey&&cloud){session=read(sessionKey,null);if(!session)showLogin();else sync()}
    if(event.key===docKey&&!cloud&&doc&&!typing()){doc=HubCore.normalize(read(docKey,doc));renderContent()}
  });
  async function start(){
    openStates=read(openKey,{});setEditing(false,false);
    if(!cloud){
      const embedded=JSON.parse($('hub-data').textContent);
      if(!embedded){setState('Noch nicht eingerichtet','error');return}
      const stored=read(docKey,null);
      doc=HubCore.normalize(stored||HubCore.snapshot(embedded,HubCore.sanitize(embedded,read(statusKey,{}))));
      if(!stored)write(docKey,doc);
      renderContent();saved();return;
    }
    session=read(sessionKey,null);
    if(!session){showLogin();return}
    setState('Wird geladen …');const epoch=authEpoch;
    try{const next=await fetchCloud();if(epoch!==authEpoch)return;adopt(next)}
    catch{showLogin('Verbindung prüfen und erneut anmelden.')}
  }
  setInterval(sync,15000);start();
})();
</script>
</body>
</html>
